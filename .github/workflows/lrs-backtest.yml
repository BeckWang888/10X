name: LRS 回測（TQQQ / SOXL）

on:
  push:
    branches: ["claude/**"]
    paths: ["lrs/backtest_lrs.py", ".github/workflows/lrs-backtest.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lrs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt matplotlib

      - name: 回測
        run: python lrs/backtest_lrs.py

      - name: 把結果存回這個分支
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add lrs/results
          git diff --cached --quiet || git commit -m "LRS 回測結果 $(date +%F)"
          git pull --rebase -X theirs
          git push
