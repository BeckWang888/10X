name: 更新十倍股追蹤器

on:
  schedule:
    - cron: "37 7 * * 1-5"   # 台灣時間平日 15:37（台股收盤後，美股抓前一晚收盤）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按 Run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 基本面快取（7 天內不重抓）
        uses: actions/cache@v6
        with:
          path: data/cache
          key: fundamentals-${{ github.run_id }}
          restore-keys: fundamentals-

      - name: 抓資料、評分、產生儀表板
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python run.py

      - name: 把分數紀錄存回 repo
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "分數紀錄 $(date +%F)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
