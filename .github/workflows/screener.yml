name: 每月自動篩選（新候選股）

on:
  schedule:
    - cron: "0 21 2 * *"     # 每月 3 日台灣時間清晨 5:00（在 SEC 財報與回測更新之後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 全市場篩選＋AI 初評
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python screener.py

      - name: 存回 repo
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/screen data/backtest/tw_revenue.csv.gz
          git diff --cached --quiet || git commit -m "每月篩選 $(date +%F)"
          git pull --rebase -X theirs
          git push
